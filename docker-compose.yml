services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: finzup-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
